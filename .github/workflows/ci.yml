name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # task:contract / screen:contract는 Python 스크립트(scripts/*.py)를 호출한다.
      # ubuntu-latest 기본 이미지가 항상 `python` 별칭을 보장하지는 않으므로 명시적으로 준비한다.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Task contract
        run: npm run task:contract

      - name: Screen contract
        run: npm run screen:contract -- --mode=ci

      - name: Build
        run: npm run build

  public-smoke:
    name: public-smoke
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Supabase Secret 없이도 통과해야 하는 공개 Smoke만 실행한다. 인증이 필요한
      # tests/e2e/auth-smoke.spec.ts는 이 Workflow의 필수 Gate가 아니므로 여기서
      # 실행하지 않는다(로컬 또는 별도 Job에서 E2E_AUTH_EMAIL/E2E_AUTH_PASSWORD가
      # 있을 때만 돌린다).
      - name: Public Smoke (Playwright, Chromium)
        run: npm run test:e2e:public

      - name: Upload Playwright report (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
